# DuckDock 前端生产 nginx:SPA + /api 反代后端(单端口入口)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Docker 内嵌 DNS。用变量做 upstream 强制 nginx 按需重新解析 backend 的 IP:
    # 直写 proxy_pass http://backend:8801 只在启动时解析一次,backend 重启换 IP 后
    # 会一直 502。resolver + 变量上游让解析结果带 TTL 过期、随 backend 重启自愈。
    resolver 127.0.0.11 valid=10s;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 后端 API(同源,前端 axios baseURL=/api/v1)
    location /api/ {
        set $backend_upstream backend:8801;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;          # skill 包 / 报告上传留余量
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存(带 hash 的构建产物)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
