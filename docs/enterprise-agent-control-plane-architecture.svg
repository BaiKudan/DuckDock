  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" class="title">DuckDock 企业 AI Agent 资产与交接控制平面</text>
  <text x="600" y="58" text-anchor="middle" class="subtitle">统一管理多厂商 Agent 资产、运行现场、工作成果与离职交接，让企业 AI 能力可复用、可延续、可审计</text>

  <rect x="60" y="76" width="1080" height="38" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="600" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">经营目标：资产看得见 ｜ 风险管得住 ｜ 离职接得住 ｜ 交付可复制</text>

