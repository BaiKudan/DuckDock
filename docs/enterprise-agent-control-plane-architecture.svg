  <text x="600" y="650" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">核心价值：不是再做一个 Skill 仓库，而是把“谁拥有、谁使用、在哪运行、产出什么、离职谁接”统一管理起来</text>
