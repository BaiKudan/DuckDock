  <rect width="1200" height="820" fill="#ffffff"/>

  <text x="40" y="42" class="title">DuckDock 通用 Adapter 采集与交接流程</text>
  <text x="40" y="65" class="subtitle">控制平面负责任务、状态、审计和交接；厂商差异收敛在 Adapter；原始记录与证据链可追溯。</text>

  <!-- Lanes -->
  <rect x="30" y="88" width="1140" height="122" rx="10" class="lane"/>
  <text x="46" y="110" class="lane-label">1. 使用入口：接入运行时、触发同步、上传备份包</text>

  <rect x="30" y="232" width="1140" height="152" rx="10" class="lane"/>
  <text x="46" y="254" class="lane-label">2. 采集任务：统一状态机、异步执行、步骤留痕</text>

  <rect x="30" y="406" width="1140" height="152" rx="10" class="lane"/>
  <text x="46" y="428" class="lane-label">3. Adapter 与数据标准化：API / Backup / 导出包 / 浏览器兜底</text>

  <rect x="30" y="580" width="1140" height="142" rx="10" class="lane"/>
  <text x="46" y="602" class="lane-label">4. 控制平面资产库与交接治理：资产、归属、工作历程、证据、审批执行</text>

