<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="1160" height="720">
  <style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.title { fill:#111827; font-size:24px; font-weight:700; }
.subtitle { fill:#6b7280; font-size:13px; }
.lane-label { fill:#4f46e5; font-size:11px; font-weight:700; letter-spacing:.08em; }
.node-title { fill:#111827; font-size:14px; font-weight:700; }
.node-sub { fill:#6b7280; font-size:11px; }
.tiny { fill:#6b7280; font-size:10px; }
.arrow-label { fill:#374151; font-size:11px; font-weight:600; }
.tag { fill:#4b5563; font-size:10px; font-weight:600; }
</style>
  
<defs>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#ea580c"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#9333ea"/>
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#6b7280"/>
  </marker>
</defs>

  <rect width="1160" height="720" fill="#ffffff"/>
  <text x="36" y="42" class="title">Reporter 接入与上报业务流程</text>
  <text x="36" y="66" class="subtitle">员工或数字员工通过自助 enroll 拿 Reporter Credential；运行时只拿 dkr_report_* 和一次性上传 URL，不接触 MinIO 密钥。</text>

  <rect x="28" y="96" width="260" height="590" rx="10" fill="#eff6ff" fill-opacity="0.42" stroke="#bfdbfe" stroke-dasharray="7,5"/>
  <text x="44" y="120" class="lane-label">ENROLLMENT SETUP</text>
  <rect x="312" y="96" width="260" height="590" rx="10" fill="#fff7ed" fill-opacity="0.42" stroke="#fed7aa" stroke-dasharray="7,5"/>
  <text x="328" y="120" class="lane-label">RUNTIME SIDE</text>
  <rect x="596" y="96" width="260" height="590" rx="10" fill="#f8fafc" fill-opacity="0.42" stroke="#d1d5db" stroke-dasharray="7,5"/>
  <text x="612" y="120" class="lane-label">DUCKDOCK API</text>
  <rect x="880" y="96" width="260" height="590" rx="10" fill="#f0fdf4" fill-opacity="0.42" stroke="#bbf7d0" stroke-dasharray="7,5"/>
  <text x="896" y="120" class="lane-label">OBJECT STORE / QUEUE</text>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="140" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="158" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="182" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">1</text>
    <text x="116" y="168" class="node-title">登录 DuckDock</text>
<text x="116" y="188" class="node-sub">员工/Agent 认证</text>
<text x="116" y="205" class="node-sub">自助登记 endpoint</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="260" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="278" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="302" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">2</text>
    <text x="116" y="288" class="node-title">自助 Reporter 凭证</text>
<text x="116" y="308" class="node-sub">dkr_report_* credential</text>
<text x="116" y="325" class="node-sub">长期可撤销 / 可轮换</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="380" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="398" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="422" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">3</text>
    <text x="116" y="408" class="node-title">指定私有 Registry</text>
<text x="116" y="428" class="node-sub">skill.md 地址</text>
<text x="116" y="445" class="node-sub">安装 duckdock-reporter</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="338" y="140" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="352" y="158" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="371" y="182" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">A</text>
    <text x="400" y="168" class="node-title">对话式安装</text>
<text x="400" y="188" class="node-sub">WorkBuddy/OpenClaw</text>
<text x="400" y="205" class="node-sub">按 SOP 创建任务</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="338" y="260" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="352" y="278" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="371" y="302" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">B</text>
    <text x="400" y="288" class="node-title">周期采集</text>
<text x="400" y="308" class="node-sub">Skills/Agents/Prompts</text>
<text x="400" y="325" class="node-sub">会话摘要/记忆索引/证据</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="338" y="380" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="352" y="398" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="371" y="422" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">C</text>
    <text x="400" y="408" class="node-title">生成 pack</text>
<text x="400" y="428" class="node-sub">duckdock-pack-v1.zip</text>
<text x="400" y="445" class="node-sub">hash、manifest、summary</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="622" y="140" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="636" y="158" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="655" y="182" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">API</text>
    <text x="684" y="168" class="node-title">Create Upload Session</text>
<text x="684" y="188" class="node-sub">返回一次性 PUT URL</text>
<text x="684" y="205" class="node-sub">记录 report_id/object_key</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="622" y="260" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="636" y="278" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="655" y="302" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">FIN</text>
    <text x="684" y="288" class="node-title">Finalize Report</text>
<text x="684" y="308" class="node-sub">校验 size/sha256</text>
<text x="684" y="325" class="node-sub">创建 analysis job</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="622" y="380" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="636" y="398" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="655" y="422" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">STA</text>
    <text x="684" y="408" class="node-title">Reporter 状态</text>
<text x="684" y="428" class="node-sub">Portal 显示健康度</text>
<text x="684" y="445" class="node-sub">管理员可审计</text>
  </g>
  <g filter="url(#soft-shadow)">
    <ellipse cx="978" cy="160" rx="60" ry="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="918" y="160" width="120" height="78" fill="#dcfce7" stroke="none"/>
    <line x1="918" y1="160" x2="918" y2="238" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="1038" y1="160" x2="1038" y2="238" stroke="#16a34a" stroke-width="1.5"/>
    <ellipse cx="978" cy="238" rx="60" ry="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="978" y="199" text-anchor="middle" class="node-title">MinIO</text>
    <text x="978" y="217" text-anchor="middle" class="node-sub">原始 pack 暂存</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="906" y="300" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="920" y="318" width="38" height="38" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="939" y="342" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="700">JOB</text>
    <text x="968" y="328" class="node-title">Analysis Job</text>
<text x="968" y="348" class="node-sub">pending 队列</text>
<text x="968" y="365" class="node-sub">等待 worker lease</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="906" y="420" width="208" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="920" y="438" width="38" height="38" rx="8" fill="#e0f2fe" stroke="#93c5fd"/>
    <text x="939" y="462" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">SQL</text>
    <text x="968" y="448" class="node-title">MySQL 元数据</text>
<text x="968" y="468" class="node-sub">report_id/runtime_id</text>
<text x="968" y="485" class="node-sub">sha256/object_key/status</text>
  </g>
  <line x1="158" y1="218" x2="158" y2="260" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="116" y="218" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="158" y="231" text-anchor="middle" class="arrow-label">enroll</text>
  <line x1="158" y1="338" x2="158" y2="380" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="116" y="338" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="158" y="351" text-anchor="middle" class="arrow-label">保存</text>
  <line x1="262" y1="420" x2="338" y2="180" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="258" y="279" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="300" y="292" text-anchor="middle" class="arrow-label">配置</text>
  <line x1="442" y1="218" x2="442" y2="260" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="400" y="218" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="442" y="231" text-anchor="middle" class="arrow-label">定时</text>
  <line x1="442" y1="338" x2="442" y2="380" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="400" y="338" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="442" y="351" text-anchor="middle" class="arrow-label">打包</text>
  <line x1="546" y1="420" x2="622" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="542" y="279" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="584" y="292" text-anchor="middle" class="arrow-label">申请上传</text>
  <line x1="830" y1="180" x2="978" y2="160" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="862" y="149" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="904" y="162" text-anchor="middle" class="arrow-label">PUT 包</text>
  <line x1="978" y1="238" x2="726" y2="260" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="810" y="228" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="852" y="241" text-anchor="middle" class="arrow-label">object_key</text>
  <line x1="726" y1="338" x2="726" y2="380" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="684" y="338" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="726" y="351" text-anchor="middle" class="arrow-label">状态回写</text>
  <line x1="830" y1="300" x2="906" y2="339" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="826" y="298" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="868" y="311" text-anchor="middle" class="arrow-label">创建任务</text>
  <line x1="830" y1="300" x2="978" y2="459" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="862" y="358" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="904" y="371" text-anchor="middle" class="arrow-label">写元数据</text><line x1="54" y1="622" x2="86" y2="622" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<text x="96" y="626" class="tiny">主数据流</text>
<line x1="54" y1="642" x2="86" y2="642" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
<text x="96" y="646" class="tiny">写入/入库</text>
<line x1="54" y1="662" x2="86" y2="662" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
<text x="96" y="666" class="tiny">控制/触发</text>
<line x1="54" y1="682" x2="86" y2="682" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
<text x="96" y="686" class="tiny">LLM/转换</text>
<line x1="54" y1="702" x2="86" y2="702" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>
<text x="96" y="706" class="tiny">异步/可选</text>
</svg>
