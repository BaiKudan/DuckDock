<text x="376" y="414" class="node-sub">auto/llm 模式调用 qwen3.7-max</text>
<text x="376" y="431" class="node-sub">默认 baseline 也可跑通</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="314" y="496" width="292" height="82" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="328" y="514" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="347" y="538" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">MRG</text>
    <text x="376" y="524" class="node-title">规范化与合并</text>
<text x="376" y="544" class="node-sub">schema normalize</text>
<text x="376" y="561" class="node-sub">LLM/baseline 去重</text>
  </g>
  <g filter="url(#soft-shadow)">
