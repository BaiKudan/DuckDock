    <rect x="706" y="150" width="120" height="76" fill="#dcfce7" stroke="none"/>
    <line x1="706" y1="150" x2="706" y2="226" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="826" y1="150" x2="826" y2="226" stroke="#16a34a" stroke-width="1.5"/>
    <ellipse cx="766" cy="226" rx="60" ry="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="766" y="188" text-anchor="middle" class="node-title">MinIO</text>
    <text x="766" y="206" text-anchor="middle" class="node-sub">duckdock-pack</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="314" y="142" width="292" height="76" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="328" y="160" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="347" y="184" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">ZIP</text>
    <text x="376" y="170" class="node-title">下载与解包</text>
<text x="376" y="190" class="node-sub">manifest/runtime/inventory/summaries</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="314" y="254" width="292" height="76" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="328" y="272" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="347" y="296" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">BAS</text>
