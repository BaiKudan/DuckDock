  <line x1="776" y1="390" x2="776" y2="480" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="734" y="414" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
