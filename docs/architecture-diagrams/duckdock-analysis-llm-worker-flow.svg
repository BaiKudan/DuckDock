    <line x1="706" y1="480" x2="706" y2="556" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="826" y1="480" x2="826" y2="556" stroke="#16a34a" stroke-width="1.5"/>
    <ellipse cx="766" cy="556" rx="60" ry="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="766" y="518" text-anchor="middle" class="node-title">MinIO</text>
    <text x="766" y="536" text-anchor="middle" class="node-sub">analysis result</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="944" y="176" width="164" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="958" y="194" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="977" y="218" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">FIN</text>
    <text x="1006" y="204" class="node-title">Finalize Job</text>
<text x="1006" y="224" class="node-sub">校验 sha256/size</text>
<text x="1006" y="241" class="node-sub">状态 succeeded</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="944" y="326" width="164" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="958" y="344" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="977" y="368" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">MAT</text>
    <text x="1006" y="354" class="node-title">Materializer</text>
<text x="1006" y="374" class="node-sub">读取结果制品</text>
<text x="1006" y="391" class="node-sub">精简字段入库</text>
  </g>
  <g filter="url(#soft-shadow)">
    <ellipse cx="1026" cy="508" rx="58" ry="16" fill="#e0f2fe" stroke="#4479A1" stroke-width="1.5"/>
    <rect x="968" y="508" width="116" height="76" fill="#e0f2fe" stroke="none"/>
    <line x1="968" y1="508" x2="968" y2="584" stroke="#4479A1" stroke-width="1.5"/>
    <line x1="1084" y1="508" x2="1084" y2="584" stroke="#4479A1" stroke-width="1.5"/>
    <ellipse cx="1026" cy="584" rx="58" ry="16" fill="#e0f2fe" stroke="#4479A1" stroke-width="1.5"/>
