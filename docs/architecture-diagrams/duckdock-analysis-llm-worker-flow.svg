<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 730" width="1160" height="730">
  <style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.title { fill:#111827; font-size:24px; font-weight:700; }
.subtitle { fill:#6b7280; font-size:13px; }
.lane-label { fill:#4f46e5; font-size:11px; font-weight:700; letter-spacing:.08em; }
.node-title { fill:#111827; font-size:14px; font-weight:700; }
.node-sub { fill:#6b7280; font-size:11px; }
.tiny { fill:#6b7280; font-size:10px; }
.arrow-label { fill:#374151; font-size:11px; font-weight:600; }
.tag { fill:#4b5563; font-size:10px; font-weight:600; }
</style>
  
<defs>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#ea580c"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#9333ea"/>
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#6b7280"/>
  </marker>
</defs>

  <rect width="1160" height="730" fill="#ffffff"/>
  <text x="36" y="42" class="title">Analysis Worker 与入库流程</text>
  <text x="36" y="66" class="subtitle">Worker 不扫描员工电脑，不拿 MinIO 密钥；默认可用 baseline，配置 auto/llm 后可调用 qwen3.7-max 生成更高质量结果。</text>

  <rect x="28" y="96" width="230" height="600" rx="10" fill="#f8fafc" fill-opacity="0.42" stroke="#d1d5db" stroke-dasharray="7,5"/>
  <text x="44" y="120" class="lane-label">QUEUE</text>
  <rect x="282" y="96" width="356" height="600" rx="10" fill="#faf5ff" fill-opacity="0.42" stroke="#e9d5ff" stroke-dasharray="7,5"/>
  <text x="298" y="120" class="lane-label">ANALYSIS WORKER</text>
  <rect x="662" y="96" width="230" height="600" rx="10" fill="#f0fdf4" fill-opacity="0.42" stroke="#bbf7d0" stroke-dasharray="7,5"/>
  <text x="678" y="120" class="lane-label">ARTIFACTS</text>
  <rect x="916" y="96" width="220" height="600" rx="10" fill="#eff6ff" fill-opacity="0.42" stroke="#bfdbfe" stroke-dasharray="7,5"/>
  <text x="932" y="120" class="lane-label">CONTROL PLANE</text>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="150" width="178" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="168" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="192" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">JOB</text>
    <text x="116" y="178" class="node-title">Pending Job</text>
<text x="116" y="198" class="node-sub">report pack 已上传</text>
<text x="116" y="215" class="node-sub">等待 lease</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="300" width="178" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="318" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="342" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">LSE</text>
    <text x="116" y="328" class="node-title">Lease / Heartbeat</text>
<text x="116" y="348" class="node-sub">worker token</text>
<text x="116" y="365" class="node-sub">租约、重试、幂等</text>
  </g>
  <g filter="url(#soft-shadow)">
