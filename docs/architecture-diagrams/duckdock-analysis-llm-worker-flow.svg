<text x="744" y="342" class="node-sub">analysis-result</text>
<text x="744" y="359" class="node-sub">asset-cards</text>
<text x="744" y="376" class="node-sub">worktrace-summary</text>
<text x="744" y="393" class="node-sub">memory-candidates</text>
<text x="744" y="410" class="node-sub">handover-signals</text>
  </g>
  <g filter="url(#soft-shadow)">
