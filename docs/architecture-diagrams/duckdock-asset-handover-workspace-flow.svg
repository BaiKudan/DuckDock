<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 730" width="1140" height="730">
  <style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.title { fill:#111827; font-size:24px; font-weight:700; }
.subtitle { fill:#6b7280; font-size:13px; }
.lane-label { fill:#4f46e5; font-size:11px; font-weight:700; letter-spacing:.08em; }
.node-title { fill:#111827; font-size:14px; font-weight:700; }
.node-sub { fill:#6b7280; font-size:11px; }
.tiny { fill:#6b7280; font-size:10px; }
.arrow-label { fill:#374151; font-size:11px; font-weight:600; }
.tag { fill:#4b5563; font-size:10px; font-weight:600; }
</style>
  
<defs>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#ea580c"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#9333ea"/>
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#6b7280"/>
  </marker>
</defs>

  <rect width="1140" height="730" fill="#ffffff"/>
  <text x="36" y="42" class="title">个人工作台与交接闭环流程</text>
  <text x="36" y="66" class="subtitle">平台专注 AI 资产和用户维度交接；组织管理只保留岗位状态和交接单，不把 DuckDock 变成大型 HR/OA 系统。</text>

  <rect x="28" y="96" width="254" height="600" rx="10" fill="#f0fdfa" fill-opacity="0.42" stroke="#99f6e4" stroke-dasharray="7,5"/>
  <text x="44" y="120" class="lane-label">EMPLOYEE PORTAL</text>
  <rect x="306" y="96" width="276" height="600" rx="10" fill="#f8fafc" fill-opacity="0.42" stroke="#d1d5db" stroke-dasharray="7,5"/>
  <text x="322" y="120" class="lane-label">CONTROL PLANE</text>
  <rect x="606" y="96" width="254" height="600" rx="10" fill="#eff6ff" fill-opacity="0.42" stroke="#bfdbfe" stroke-dasharray="7,5"/>
  <text x="622" y="120" class="lane-label">MANAGER VIEW</text>
  <rect x="884" y="96" width="230" height="600" rx="10" fill="#fff7ed" fill-opacity="0.42" stroke="#fed7aa" stroke-dasharray="7,5"/>
  <text x="900" y="120" class="lane-label">LIGHT HANDOVER</text>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="140" width="202" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="158" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="182" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">ME</text>
    <text x="116" y="168" class="node-title">我的 AI 资产</text>
<text x="116" y="188" class="node-sub">Skills / Agents / Prompts</text>
<text x="116" y="205" class="node-sub">待确认、已确认、排除</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="266" width="202" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="284" width="38" height="38" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="87" y="308" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="700">TRC</text>
    <text x="116" y="294" class="node-title">最近工作历程</text>
<text x="116" y="314" class="node-sub">会话摘要、项目上下文</text>
<text x="116" y="331" class="node-sub">不展示原始私聊</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="392" width="202" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="410" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="434" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">REP</text>
    <text x="116" y="420" class="node-title">Reporter 状态</text>
<text x="116" y="440" class="node-sub">健康度、最近上报</text>
<text x="116" y="457" class="node-sub">dry-run 引导</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="332" y="158" width="224" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="346" y="176" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="365" y="200" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">OWN</text>
    <text x="394" y="186" class="node-title">资产归属</text>
<text x="394" y="206" class="node-sub">AssetOwnership</text>
<text x="394" y="223" class="node-sub">owner_hint -&gt; 用户</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="332" y="284" width="224" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="346" y="302" width="38" height="38" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="365" y="326" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="700">MEM</text>
    <text x="394" y="312" class="node-title">长期记忆候选</text>
<text x="394" y="332" class="node-sub">project_context</text>
<text x="394" y="349" class="node-sub">handover/risk signal</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="332" y="410" width="224" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="346" y="428" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="365" y="452" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">FB</text>
    <text x="394" y="438" class="node-title">员工反馈</text>
<text x="394" y="458" class="node-sub">确认、补充、排除</text>
<text x="394" y="475" class="node-sub">记录到 metadata</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="632" y="146" width="202" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="646" y="164" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="665" y="188" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">ADM</text>
    <text x="694" y="174" class="node-title">管理员资产视图</text>
<text x="694" y="194" class="node-sub">风险资产、缺口</text>
<text x="694" y="211" class="node-sub">运行时覆盖</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="632" y="272" width="202" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="646" y="290" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="665" y="314" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">JOB</text>
    <text x="694" y="300" class="node-title">岗位状态</text>
<text x="694" y="320" class="node-sub">active 默认隐藏交接</text>
<text x="694" y="337" class="node-sub">leave/offboarded 才显示</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="632" y="398" width="202" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="646" y="416" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="665" y="440" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">QUE</text>
    <text x="694" y="426" class="node-title">交接队列</text>
<text x="694" y="446" class="node-sub">按用户/岗位交接闭环</text>
<text x="694" y="463" class="node-sub">不纳管复杂组织流程</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="910" y="176" width="178" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="924" y="194" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="943" y="218" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">HC</text>
    <text x="972" y="204" class="node-title">创建交接单</text>
<text x="972" y="224" class="node-sub">subject_user</text>
<text x="972" y="241" class="node-sub">receiver/due date</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="910" y="316" width="178" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="924" y="334" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="943" y="358" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">ANL</text>
    <text x="972" y="344" class="node-title">分析交接项</text>
<text x="972" y="364" class="node-sub">资产、风险、证据</text>
<text x="972" y="381" class="node-sub">建议人工确认</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="910" y="456" width="178" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="924" y="474" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="943" y="498" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">END</text>
    <text x="972" y="484" class="node-title">执行/关闭</text>
<text x="972" y="504" class="node-sub">审批、转移、禁用</text>
<text x="972" y="521" class="node-sub">保留审计</text>
  </g>
  <line x1="256" y1="180" x2="332" y2="197" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="252" y="167" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="294" y="180" text-anchor="middle" class="arrow-label">确认归属</text>
  <line x1="256" y1="305" x2="332" y2="323" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="252" y="293" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="294" y="306" text-anchor="middle" class="arrow-label">沉淀上下文</text>
  <line x1="256" y1="431" x2="332" y2="449" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="252" y="419" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="294" y="432" text-anchor="middle" class="arrow-label">健康信号</text>
  <line x1="444" y1="236" x2="444" y2="284" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="402" y="239" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="444" y="252" text-anchor="middle" class="arrow-label">候选</text>
  <line x1="444" y1="362" x2="444" y2="410" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="402" y="365" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="444" y="378" text-anchor="middle" class="arrow-label">反馈</text>
  <line x1="556" y1="197" x2="632" y2="185" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="552" y="170" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="594" y="183" text-anchor="middle" class="arrow-label">治理视图</text>
  <line x1="734" y1="224" x2="734" y2="272" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="692" y="227" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="734" y="240" text-anchor="middle" class="arrow-label">标记状态</text>
  <line x1="734" y1="350" x2="734" y2="398" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="692" y="353" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="734" y="366" text-anchor="middle" class="arrow-label">生成队列</text>
  <line x1="834" y1="437" x2="910" y2="215" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="830" y="305" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="872" y="318" text-anchor="middle" class="arrow-label">创建</text>
  <line x1="999" y1="254" x2="999" y2="316" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <rect x="957" y="264" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="999" y="277" text-anchor="middle" class="arrow-label">分析</text>
  <line x1="999" y1="394" x2="999" y2="456" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="957" y="404" width="84" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="999" y="417" text-anchor="middle" class="arrow-label">审批执行</text><line x1="54" y1="638" x2="86" y2="638" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<text x="96" y="642" class="tiny">主数据流</text>
<line x1="54" y1="658" x2="86" y2="658" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
<text x="96" y="662" class="tiny">写入/入库</text>
<line x1="54" y1="678" x2="86" y2="678" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
<text x="96" y="682" class="tiny">控制/触发</text>
<line x1="54" y1="698" x2="86" y2="698" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
<text x="96" y="702" class="tiny">LLM/转换</text>
<line x1="54" y1="718" x2="86" y2="718" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>
<text x="96" y="722" class="tiny">异步/可选</text>
</svg>
