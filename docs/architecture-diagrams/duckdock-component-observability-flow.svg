  <rect x="656" y="96" width="456" height="584" rx="10" fill="#faf5ff" fill-opacity="0.42" stroke="#e9d5ff" stroke-dasharray="7,5"/>
  <text x="672" y="120" class="lane-label">OPTIONAL OBSERVABILITY PROFILE</text>
