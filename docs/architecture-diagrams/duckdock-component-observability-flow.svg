  <rect width="1140" height="710" fill="#ffffff"/>
  <text x="36" y="42" class="title">组件管理与观测解耦流程</text>
  <text x="36" y="66" class="subtitle">DuckDock 核心服务默认启动；Langfuse 作为可选观测组件由管理员在控制台按需启停，不阻塞 Reporter、资产入库和交接主链路。</text>

  <rect x="28" y="96" width="280" height="584" rx="10" fill="#eff6ff" fill-opacity="0.42" stroke="#bfdbfe" stroke-dasharray="7,5"/>
  <text x="44" y="120" class="lane-label">CORE ALWAYS ON</text>
  <rect x="332" y="96" width="300" height="584" rx="10" fill="#f8fafc" fill-opacity="0.42" stroke="#d1d5db" stroke-dasharray="7,5"/>
