<text x="684" y="348" class="node-sub">我的 AI 资产</text>
<text x="684" y="365" class="node-sub">接入 SOP、反馈确认</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="622" y="448" width="190" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

