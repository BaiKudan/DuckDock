<text x="952" y="334" class="node-sub">归属资产、工作历程</text>
<text x="952" y="351" class="node-sub">Reporter 健康度</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="890" y="436" width="194" height="82" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="904" y="454" width="38" height="38" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="923" y="478" text-anchor="middle" fill="#ea580c" font-size="13" font-weight="700">HO</text>
    <text x="952" y="464" class="node-title">交接闭环域</text>
<text x="952" y="484" class="node-sub">审批/执行/回执/验收</text>
<text x="952" y="501" class="node-sub">不扩展成 HR/OA</text>
  </g>
