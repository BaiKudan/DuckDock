<text x="952" y="184" class="node-sub">Runtime / 资产 / 审计</text>
<text x="952" y="201" class="node-sub">Components 仅 admin</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="890" y="286" width="194" height="82" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="904" y="304" width="38" height="38" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
