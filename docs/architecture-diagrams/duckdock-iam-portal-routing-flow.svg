    <text x="87" y="474" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="700">ADM</text>
    <text x="116" y="460" class="node-title">管理员</text>
<text x="116" y="480" class="node-sub">进入管理控制台</text>
<text x="116" y="497" class="node-sub">运行时、资产、组件治理</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="326" y="142" width="216" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="340" y="160" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="359" y="184" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">AUTH</text>
    <text x="388" y="170" class="node-title">认证校验</text>
<text x="388" y="190" class="node-sub">access token</text>
<text x="388" y="207" class="node-sub">会话过期与刷新</text>
  </g>
  <g filter="url(#soft-shadow)">
