<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 720" width="1140" height="720">
  <style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.title { fill:#111827; font-size:24px; font-weight:700; }
.subtitle { fill:#6b7280; font-size:13px; }
.lane-label { fill:#4f46e5; font-size:11px; font-weight:700; letter-spacing:.08em; }
.node-title { fill:#111827; font-size:14px; font-weight:700; }
.node-sub { fill:#6b7280; font-size:11px; }
.tiny { fill:#6b7280; font-size:10px; }
.arrow-label { fill:#374151; font-size:11px; font-weight:600; }
.tag { fill:#4b5563; font-size:10px; font-weight:600; }
</style>
  
<defs>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#ea580c"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#9333ea"/>
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#6b7280"/>
  </marker>
</defs>

  <rect width="1140" height="720" fill="#ffffff"/>
  <text x="36" y="42" class="title">身份入口与权限分流流程</text>
  <text x="36" y="66" class="subtitle">同一登录入口按角色和用户状态自动分流；普通用户不进入管理后台，交接能力只在后台标记离职后对本人显示。</text>

  <rect x="28" y="96" width="246" height="594" rx="10" fill="#eff6ff" fill-opacity="0.42" stroke="#bfdbfe" stroke-dasharray="7,5"/>
  <text x="44" y="120" class="lane-label">LOGIN ENTRY</text>
  <rect x="298" y="96" width="272" height="594" rx="10" fill="#f8fafc" fill-opacity="0.42" stroke="#d1d5db" stroke-dasharray="7,5"/>
  <text x="314" y="120" class="lane-label">AUTH / IAM</text>
  <rect x="594" y="96" width="246" height="594" rx="10" fill="#f0fdfa" fill-opacity="0.42" stroke="#99f6e4" stroke-dasharray="7,5"/>
  <text x="610" y="120" class="lane-label">PORTAL ROUTING</text>
  <rect x="864" y="96" width="246" height="594" rx="10" fill="#fff7ed" fill-opacity="0.42" stroke="#fed7aa" stroke-dasharray="7,5"/>
  <text x="880" y="120" class="lane-label">BUSINESS SCOPE</text>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="148" width="194" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="166" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="87" y="190" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">IN</text>
    <text x="116" y="176" class="node-title">统一登录页</text>
<text x="116" y="196" class="node-sub">用户名/密码或 SSO</text>
<text x="116" y="213" class="node-sub">同一入口自动分流</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="54" y="290" width="194" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="68" y="308" width="38" height="38" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="87" y="332" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="700">EMP</text>
    <text x="116" y="318" class="node-title">普通员工</text>
<text x="116" y="338" class="node-sub">只进入个人工作台</text>
<text x="116" y="355" class="node-sub">看自己的资产与上报状态</text>
  </g>
