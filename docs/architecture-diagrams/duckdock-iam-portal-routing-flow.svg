<text x="684" y="496" class="node-sub">active 用户默认不显示</text>
<text x="684" y="513" class="node-sub">离职状态才暴露</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="890" y="136" width="194" height="82" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="904" y="154" width="38" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
