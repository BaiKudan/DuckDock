name: CI

on:
  push:
    branches:
      - main
    tags:
      - v2.0.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and migrations
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: duckdock_test
          MYSQL_USER: duckdock
          MYSQL_PASSWORD: duckdock
          MYSQL_ROOT_PASSWORD: duckdock-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uduckdock -pduckdock --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_NAME: DuckDock
      DEBUG: "false"
      DATABASE_URL: mysql+aiomysql://duckdock:duckdock@127.0.0.1:3306/duckdock_test?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: duckdock-ci-secret
      DUCKDOCK_CREDENTIAL_KEY: qyEzvqJMVf9na6CRD2YKj4LzWhm521Q8-w8XY5nm2K4=
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: duckdock
      MINIO_SECRET_KEY: duckdock_secret
      MINIO_BUCKET: duckdock-reports
      MINIO_SECURE: "false"
      COMPONENT_MANAGER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements-dev.lock

      - name: Audit backend dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.lock

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check app alembic scripts

      - name: Type check (mypy, baseline ratchet)
        working-directory: backend
        shell: bash
        run: |
          set +e
          output=$(python -m mypy app)
          status=$?
          echo "$output" | tail -2
          count=$(echo "$output" | sed -n 's/^Found \([0-9][0-9]*\) error.*/\1/p')
          if [ "$status" -ne 0 ] && [ -z "$count" ]; then
            echo "::error::mypy failed without a parseable error count."
            exit "$status"
          fi
          count=${count:-0}
          [ "$status" -eq 0 ] && count=0
          baseline=$(cat .mypy-baseline)
          echo "mypy errors: $count (baseline ceiling: $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::mypy errors increased to $count (> baseline $baseline). Fix new type errors."
            exit 1
          fi

      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall app alembic scripts

      - name: Run backend tests (+ core-module coverage gate)
        working-directory: backend
        run: >-
          python -m pytest
          --cov=app.core.deps
          --cov=app.services.iam_service
          --cov=app.services.release_gate_service
          --cov=app.services.credential_service
          --cov-report=term-missing
          --cov-fail-under=65

      - name: Run MySQL-marked backend tests
        working-directory: backend
        env:
          TEST_MYSQL_URL: mysql+aiomysql://duckdock:duckdock@127.0.0.1:3306/duckdock_test?charset=utf8mb4
        run: python -m pytest -m mysql

      - name: Import FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"

      - name: Verify frozen OpenAPI v2 contract
        working-directory: backend
        run: python scripts/export_openapi_v2.py --check

      - name: Apply Alembic migrations
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start DuckDock dev stack
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          bash scripts/dev.sh up

      - name: Wait for app readiness
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..60}; do
            if curl -fsS http://localhost:8801/health >/dev/null \
              && curl -fsS http://localhost:5174/login >/dev/null; then
              echo "DuckDock ready"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=120 backend frontend
          exit 1

      - name: Run E2E (auth smoke + seeded handover closed-loop)
        working-directory: frontend
        env:
          DEBUG: "true"
          E2E_AUTO_SEED: "1"
          E2E_BASE_URL: http://localhost:5174
          E2E_SEED_COMMAND: cd .. && docker compose exec -T backend python scripts/seed_handover_e2e.py --json
        run: npx playwright test

      - name: Dump stack logs on E2E failure
        if: failure()
        run: docker compose logs --tail=200 backend frontend worker beat

      - name: Stop DuckDock dev stack
        if: always()
        run: docker compose down

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare local env file
        run: cp .env.example .env

      - name: Validate default core services
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --services | sort | tee /tmp/duckdock-services.txt
          grep -qx "mysql" /tmp/duckdock-services.txt
          grep -qx "redis" /tmp/duckdock-services.txt
          grep -qx "minio" /tmp/duckdock-services.txt
          if grep -qx "analysis-worker" /tmp/duckdock-services.txt; then
            echo "Analysis worker must not be enabled by default."
            exit 1
          fi
          if grep -Eq "^(postgres|clickhouse|langfuse-db-init|langfuse-minio-init|langfuse-worker|langfuse-web)$" /tmp/duckdock-services.txt; then
            echo "Optional observability services must not be enabled by default."
            exit 1
          fi

      - name: Validate analysis worker profile
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile analysis-worker config --services | sort | tee /tmp/duckdock-analysis-worker-services.txt
          grep -qx "analysis-worker" /tmp/duckdock-analysis-worker-services.txt

      - name: Validate observability profile
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile observability config --services | sort | tee /tmp/duckdock-observability-services.txt
          grep -qx "postgres" /tmp/duckdock-observability-services.txt
          grep -qx "clickhouse" /tmp/duckdock-observability-services.txt
          grep -qx "langfuse-worker" /tmp/duckdock-observability-services.txt
          grep -qx "langfuse-web" /tmp/duckdock-observability-services.txt

      - name: Validate production Compose
        shell: bash
        run: |
          set -euo pipefail
          DUCKDOCK_PROD_ENV_FILE=.env.prod.example docker compose \
            --env-file .env.prod.example \
            -f docker-compose.prod.yml \
            -f docker-compose.prod-tls.yml \
            config --quiet

      - name: Verify production network and HA baseline
        run: python3 scripts/verify-production-baseline.py

      - name: Validate GA authorization contract
        shell: bash
        run: |
          set -euo pipefail
          python3 backend/scripts/verify_ga_production_authorization.py \
            ops/ga/production-authorization.example.json \
            --lint
          for ga_template in ops/ga/*.example.json; do
            python3 -m json.tool "$ga_template" >/dev/null
          done

      - name: Validate production operations scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/prod.sh
          bash -n scripts/restore.sh
          bash -n scripts/seal-backup.sh
          bash -n scripts/sign-ga-approval.sh
          bash -n scripts/verify-ga-infrastructure-dev.sh
          bash -n scripts/rehearse-kubernetes-ha.sh
          sh -n ops/tls-gateway/entrypoint.sh
          python3 backend/scripts/verify_ga_trust_topology.py --help >/dev/null
          python3 backend/scripts/prepare_ga_execution_campaign.py --help >/dev/null
          python3 backend/scripts/close_ga_execution_campaign.py --help >/dev/null
          python3 backend/scripts/assemble_ga_preapproval_authorization.py --help >/dev/null
          python3 backend/scripts/freeze_ga_approval_campaign.py --help >/dev/null
          python3 backend/scripts/sign_ga_approval.py --help >/dev/null
          python3 backend/scripts/finalize_ga_authorization.py --help >/dev/null
          python3 backend/scripts/archive_ga_authorized_bundle.py --help >/dev/null
          python3 backend/scripts/verify_ga_authorized_archive.py --help >/dev/null
          python3 backend/scripts/authorize_ga_publication.py --help >/dev/null

      - name: Validate Prometheus and Alertmanager configuration
        shell: bash
        run: |
          set -euo pipefail
          docker build -t duckdock-alertmanager:ci ops/alertmanager
          docker run --rm \
            -v "$PWD/ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/ops/prometheus/duckdock-alerts.yml:/etc/prometheus/duckdock-alerts.yml:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/ops/alertmanager/alertmanager.example.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint /bin/amtool \
            duckdock-alertmanager:ci \
            check-config /etc/alertmanager/alertmanager.yml

  release-images:
    name: Release images and vulnerability gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, compose]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify final signed tag
        if: github.ref == 'refs/tags/v2.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_object="$(git rev-parse refs/tags/v2.0.0)"
          test "$(git cat-file -t "$tag_object")" = tag
          test "$(git rev-parse 'refs/tags/v2.0.0^{}')" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > /tmp/v2.0.0-tag-verification.json
          test "$(jq -r '.verification.verified' /tmp/v2.0.0-tag-verification.json)" = true

      - name: Log in to GHCR for final tag
        if: github.ref == 'refs/tags/v2.0.0'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend release image with provenance and SBOM
        id: build_backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "{{defaultContext}}:backend"
          file: Dockerfile
          platforms: linux/amd64
          load: ${{ github.ref != 'refs/tags/v2.0.0' }}
          push: ${{ github.ref == 'refs/tags/v2.0.0' }}
          tags: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-backend:build-{0}', github.sha) || 'duckdock-backend:2.0.0-rc.1' }}
          provenance: mode=max,version=v1
          sbom: true

      - name: Scan backend release image
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-backend@{0}', steps.build_backend.outputs.digest) || 'local://duckdock-backend:2.0.0-rc.1' }}
          only-severities: critical,high
          exit-code: true
          sarif-file: backend-scout.sarif.json

      - name: Build frontend release image with provenance and SBOM
        id: build_frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "{{defaultContext}}:frontend"
          file: Dockerfile.prod
          platforms: linux/amd64
          load: ${{ github.ref != 'refs/tags/v2.0.0' }}
          push: ${{ github.ref == 'refs/tags/v2.0.0' }}
          tags: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-frontend:build-{0}', github.sha) || 'duckdock-frontend:2.0.0-rc.1' }}
          provenance: mode=max,version=v1
          sbom: true

      - name: Scan frontend release image
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-frontend@{0}', steps.build_frontend.outputs.digest) || 'local://duckdock-frontend:2.0.0-rc.1' }}
          only-severities: critical,high
          exit-code: true
          sarif-file: frontend-scout.sarif.json

      - name: Build TLS gateway with provenance and SBOM
        id: build_tls_gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "{{defaultContext}}:ops/tls-gateway"
          file: Dockerfile
          platforms: linux/amd64
          load: ${{ github.ref != 'refs/tags/v2.0.0' }}
          push: ${{ github.ref == 'refs/tags/v2.0.0' }}
          tags: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-tls-gateway:build-{0}', github.sha) || 'duckdock-tls-gateway:2.0.0-rc.1' }}
          provenance: mode=max,version=v1
          sbom: true

      - name: Scan TLS gateway
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-tls-gateway@{0}', steps.build_tls_gateway.outputs.digest) || 'local://duckdock-tls-gateway:2.0.0-rc.1' }}
          only-severities: critical,high
          exit-code: true
          sarif-file: tls-gateway-scout.sarif.json

      - name: Build patched Alertmanager with provenance and SBOM
        id: build_alertmanager
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "{{defaultContext}}:ops/alertmanager"
          file: Dockerfile
          platforms: linux/amd64
          load: ${{ github.ref != 'refs/tags/v2.0.0' }}
          push: ${{ github.ref == 'refs/tags/v2.0.0' }}
          tags: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-alertmanager:build-{0}', github.sha) || 'duckdock-alertmanager:0.33.1-duckdock.1' }}
          provenance: mode=max,version=v1
          sbom: true

      - name: Scan patched Alertmanager
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: ${{ github.ref == 'refs/tags/v2.0.0' && format('ghcr.io/baikudan/duckdock-alertmanager@{0}', steps.build_alertmanager.outputs.digest) || 'local://duckdock-alertmanager:0.33.1-duckdock.1' }}
          only-severities: critical,high
          exit-code: true
          sarif-file: alertmanager-scout.sarif.json

      - name: Retain final vulnerability scan reports
        id: upload_scan_reports
        if: github.ref == 'refs/tags/v2.0.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duckdock-v2.0.0-scout-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend-scout.sarif.json
            frontend-scout.sarif.json
            tls-gateway-scout.sarif.json
            alertmanager-scout.sarif.json
          if-no-files-found: error
          retention-days: 90

      - name: Promote scanned image indexes to previously unused final tags
        if: github.ref == 'refs/tags/v2.0.0'
        shell: bash
        run: |
          set -euo pipefail
          final_images=(
            ghcr.io/baikudan/duckdock-backend:2.0.0
            ghcr.io/baikudan/duckdock-frontend:2.0.0
            ghcr.io/baikudan/duckdock-tls-gateway:2.0.0
            ghcr.io/baikudan/duckdock-alertmanager:0.33.1-duckdock.1
          )
          for final_image in "${final_images[@]}"; do
            if docker buildx imagetools inspect "$final_image" \
              >/tmp/duckdock-final-tag-check.txt 2>&1; then
              echo "final tag already exists; refusing overwrite: $final_image" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|name unknown|not found|404' \
              /tmp/duckdock-final-tag-check.txt; then
              cat /tmp/duckdock-final-tag-check.txt >&2
              echo "could not prove final tag is absent: $final_image" >&2
              exit 1
            fi
          done
          docker buildx imagetools create \
            --tag ghcr.io/baikudan/duckdock-backend:2.0.0 \
            "ghcr.io/baikudan/duckdock-backend@${{ steps.build_backend.outputs.digest }}"
          docker buildx imagetools create \
            --tag ghcr.io/baikudan/duckdock-frontend:2.0.0 \
            "ghcr.io/baikudan/duckdock-frontend@${{ steps.build_frontend.outputs.digest }}"
          docker buildx imagetools create \
            --tag ghcr.io/baikudan/duckdock-tls-gateway:2.0.0 \
            "ghcr.io/baikudan/duckdock-tls-gateway@${{ steps.build_tls_gateway.outputs.digest }}"
          docker buildx imagetools create \
            --tag ghcr.io/baikudan/duckdock-alertmanager:0.33.1-duckdock.1 \
            "ghcr.io/baikudan/duckdock-alertmanager@${{ steps.build_alertmanager.outputs.digest }}"

      - name: Resolve deployable platform image digests
        id: platform_digests
        if: github.ref == 'refs/tags/v2.0.0'
        shell: bash
        run: |
          set -euo pipefail
          platform_digest() {
            docker buildx imagetools inspect "$1" --raw | jq -er '
              [.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == "amd64")
                | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                | .digest]
              | if length == 1 then .[0] else error("expected exactly one linux/amd64 image manifest") end'
          }
          echo "backend=$(platform_digest ghcr.io/baikudan/duckdock-backend:2.0.0)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(platform_digest ghcr.io/baikudan/duckdock-frontend:2.0.0)" >> "$GITHUB_OUTPUT"
          echo "tls_gateway=$(platform_digest ghcr.io/baikudan/duckdock-tls-gateway:2.0.0)" >> "$GITHUB_OUTPUT"
          echo "alertmanager=$(platform_digest ghcr.io/baikudan/duckdock-alertmanager:0.33.1-duckdock.1)" >> "$GITHUB_OUTPUT"

      - name: Publish immutable final coordinates
        if: github.ref == 'refs/tags/v2.0.0'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## DuckDock 2.0.0 immutable images'
            echo
            echo '```text'
            echo "git_commit=$GITHUB_SHA"
            echo "backend_image=ghcr.io/baikudan/duckdock-backend@${{ steps.platform_digests.outputs.backend }}"
            echo "backend_attestation_image=ghcr.io/baikudan/duckdock-backend@${{ steps.build_backend.outputs.digest }}"
            echo "frontend_image=ghcr.io/baikudan/duckdock-frontend@${{ steps.platform_digests.outputs.frontend }}"
            echo "frontend_attestation_image=ghcr.io/baikudan/duckdock-frontend@${{ steps.build_frontend.outputs.digest }}"
            echo "tls_gateway_image=ghcr.io/baikudan/duckdock-tls-gateway@${{ steps.platform_digests.outputs.tls_gateway }}"
            echo "tls_gateway_attestation_image=ghcr.io/baikudan/duckdock-tls-gateway@${{ steps.build_tls_gateway.outputs.digest }}"
            echo "alertmanager_image=ghcr.io/baikudan/duckdock-alertmanager@${{ steps.platform_digests.outputs.alertmanager }}"
            echo "alertmanager_attestation_image=ghcr.io/baikudan/duckdock-alertmanager@${{ steps.build_alertmanager.outputs.digest }}"
            echo "scan_artifact_digest=${{ steps.upload_scan_reports.outputs.artifact-digest }}"
            echo "scan_artifact_url=${{ steps.upload_scan_reports.outputs.artifact-url }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
