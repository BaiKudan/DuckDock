openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: DuckDock Agent Execution API
  version: 2.0.0-draft
  summary: Reporter ingestion and governed AgentRun read contracts for DuckDock 2.0.
  description: |
    Foundation contract for metadata-only Agent Harness execution reporting.
    Reporter writes are authenticated with scoped Reporter bearer tokens and are
    idempotent. Namespace and Runtime identity are derived from the credential;
    they are never accepted from the Reporter request body. Raw prompts,
    completions, tool arguments, tool results, retrieved content, and hidden
    chain-of-thought are outside this API contract.
servers:
  - url: /
tags:
  - name: Reporter Sessions
    description: Reporter-authenticated Agent session lifecycle ingestion.
  - name: Reporter Runs
    description: Reporter-authenticated Agent run lifecycle ingestion.
  - name: Generic OTLP
    description: Collector-authenticated OTLP JSON to governed Run/reference projection.
  - name: Pack ATIF
    description: Reporter-authenticated immutable Pack upload and ATIF preflight.
  - name: Adapter Fleet
    description: Dynamic adapter negotiation, heartbeat drift and Fleet visibility.
  - name: Agent Runs
    description: User-authenticated governed AgentRun queries.
  - name: Agent Run Artifacts
    description: User-authenticated immutable artifact metadata registration.
  - name: Telemetry Sinks
    description: RBAC-scoped provider-neutral telemetry configuration.
  - name: Outbox Operations
    description: System-administrator health and failed-event recovery operations.
  - name: Compatibility Reconciliation
    description: System-administrator v1 Structured Report to v2 execution reconciliation.
paths:
  /api/v2/reporter/sessions:
    post:
      tags:
        - Reporter Sessions
      summary: Start an Agent session
      description: |
        Creates or replays a metadata-only session start. Reusing an
        Idempotency-Key with the same canonical request returns the original
        result; reusing it with a different request returns 409. New starts
        may be rollout-controlled globally or by Runtime allowlist. Completion
        remains available when starts are disabled.
      operationId: startReporterSession
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStartRequest'
      responses:
        '201':
          description: Session created or idempotently replayed.
          headers:
            Location:
              description: Canonical URL of the session resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/IngestionDisabled'

  /api/v2/reporter/sessions/{session_public_id}/complete:
    post:
      tags:
        - Reporter Sessions
      summary: Complete an Agent session
      operationId: completeReporterSession
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionPublicId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCompleteRequest'
      responses:
        '200':
          description: Session completion recorded or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reporter/runs:
    post:
      tags:
        - Reporter Runs
      summary: Start an Agent run
      description: |
        Starts one trace-correlated run inside an existing Reporter session.
        The Reporter token determines the Runtime and Namespace. Any optional
        Session or Deployment reference must resolve inside that same scope.
        New starts may be rollout-controlled globally or by Runtime allowlist.
      operationId: startReporterRun
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunStartRequest'
      responses:
        '201':
          description: Run created or idempotently replayed.
          headers:
            Location:
              description: Canonical URL of the AgentRun resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/IngestionDisabled'

  /api/v2/reporter/runs/{run_public_id}/complete:
    post:
      tags:
        - Reporter Runs
      summary: Complete an Agent run with metadata-only lifecycle aggregates
      operationId: completeReporterRun
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunPublicId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCompleteRequest'
      responses:
        '200':
          description: Run completion recorded or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reporter/telemetry-sinks/{sink_public_id}/v1/traces:
    post:
      tags:
        - Generic OTLP
      summary: Reconcile sanitized Generic OTLP traces
      description: |
        Accepts uncompressed standard OTLP/HTTP JSON from the registered
        per-Runtime Collector. Namespace, Runtime and trust are derived from
        the execution.write ReporterCredential. DuckDock persists only
        metadata projections; raw spans and attributes remain in the configured
        trace backend. Ambiguous or conflicting mappings return OTLP partial
        success and enter quarantine.
      operationId: ingestGenericOtlpTraces
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TelemetrySinkProjectionPublicId'
        - $ref: '#/components/parameters/AdapterHandshakeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtlpTraceExportRequest'
      responses:
        '200':
          description: Export accepted, optionally with per-batch partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtlpTraceExportResponse'
        '400':
          description: Malformed or unsupported OTLP JSON.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: OTLP projection request exceeds 1 MiB.
        '415':
          description: Only uncompressed application/json is accepted.
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reporter/pack-imports:
    post:
      tags:
        - Pack ATIF
      summary: Initialize an authenticated immutable Pack import
      description: |
        Validates a strict metadata-only duckdock-pack manifest and initializes
        either a bounded single PUT or resumable multipart upload. Namespace,
        Runtime and channel trust are derived exclusively from the Reporter
        credential. Pack ID, validated canonical manifest hash, transfer mode
        and declared Pack checksum form the durable replay identity.
      operationId: createPackImport
      security:
        - ReporterBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackImportCreate'
      responses:
        '201':
          description: Import initialized or same-content replay returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackImportCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Artifact storage is unavailable.

  /api/v2/reporter/pack-imports/{public_id}:
    get:
      tags:
        - Pack ATIF
      summary: Read one Pack import in the authenticated Runtime scope
      operationId: getPackImport
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackImportPublicId'
      responses:
        '200':
          description: Metadata-only import state and imported artifact index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/reporter/pack-imports/{public_id}/finalize:
    post:
      tags:
        - Pack ATIF
      summary: Verify and materialize an uploaded Pack
      description: |
        Verifies Pack size/checksum, archive paths, duplicate entries,
        compression bounds, the embedded canonical manifest and every declared
        ATIF payload before writing a final object or artifact event. Unknown
        ATIF versions and unauthorized content are never normalized.
      operationId: finalizePackImport
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackImportPublicId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackImportFinalize'
      responses:
        '200':
          description: Pack imported or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackImport'
        '202':
          description: Upload or retryable storage dependency is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Import mapping or identity conflict was quarantined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackImport'
        '422':
          description: Pack failed permanent schema, checksum, or safety validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackImport'

  /api/v2/reporter/pack-imports/{public_id}/multipart:
    get:
      tags:
        - Pack ATIF
      summary: Resume a multipart Pack upload from server-observed parts
      operationId: getPackMultipartState
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackImportPublicId'
      responses:
        '200':
          description: Multipart part receipts currently retained by object storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackMultipartState'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v2/reporter/pack-imports/{public_id}/multipart/parts/{part_number}:
    post:
      tags:
        - Pack ATIF
      summary: Sign one bounded multipart upload part
      operationId: createPackMultipartPartUrl
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackImportPublicId'
        - name: part_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      responses:
        '200':
          description: Short-lived part upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackMultipartPartUrl'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Artifact storage is unavailable.

  /api/v2/reporter/pack-imports/{public_id}/multipart/complete:
    post:
      tags:
        - Pack ATIF
      summary: Complete multipart transfer and verify the immutable Pack
      operationId: completePackMultipartUpload
      security:
        - ReporterBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackImportPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackMultipartComplete'
      responses:
        '200':
          description: Multipart Pack verified and imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackImport'
        '202':
          description: Verification dependency remains retryable.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Artifact storage is unavailable.

  /api/v2/reporter/pack-import-batches:
    post:
      tags:
        - Pack ATIF
      summary: Persist per-item Pack acknowledgements for an adapter queue
      description: |
        Each item is committed independently. Duplicate and out-of-order items
        return stable receipts, while ack_cursor advances only across a
        contiguous range of durable accepted or permanently rejected receipts.
      operationId: createPackImportBatch
      security:
        - ReporterBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackBatchCreate'
      responses:
        '200':
          description: Per-item accepted/replayed/retryable/rejected acknowledgements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackBatchAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reporter/pack-import-batches/{stream_id}/cursor:
    get:
      tags:
        - Pack ATIF
      summary: Read the latest durable contiguous Pack acknowledgement cursor
      operationId: getPackImportBatchCursor
      security:
        - ReporterBearerAuth: []
      parameters:
        - name: stream_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Durable cursor and advertised idempotency window.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/reporter/pack-exports:
    post:
      tags:
        - Pack ATIF
      summary: Export verified Run trajectories as an immutable ATIF Pack
      operationId: createPackExport
      security:
        - ReporterBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackExportCreate'
      responses:
        '200':
          description: New or idempotently replayed Pack export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackExport'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Artifact storage is unavailable.

  /api/v2/reporter/evaluation-replays:
    post:
      tags:
        - Pack ATIF
      summary: Replay one immutable Run evaluation result through Outbox
      operationId: replayEvaluationResult
      security:
        - ReporterBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationReplayCreate'
      responses:
        '200':
          description: Durable evaluation replay event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReplay'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reporter/handshakes:
    post:
      tags:
        - Adapter Fleet
      summary: Negotiate one credential-bound adapter descriptor
      operationId: negotiateAdapterHandshake
      security:
        - ReporterBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterDescriptor'
      responses:
        '201':
          description: Dynamic capabilities accepted and rejected by current dependencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterHandshake'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reporter/heartbeats:
    post:
      tags:
        - Adapter Fleet
      summary: Record adapter health, Collector version and configuration drift
      operationId: recordAdapterHeartbeat
      security:
        - ReporterBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterHeartbeat'
      responses:
        '200':
          description: Heartbeat accepted and compared with the negotiated descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterHeartbeatAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/fleet/runtimes:
    get:
      tags:
        - Adapter Fleet
      summary: Read dynamic Runtime capability and heartbeat Fleet state
      operationId: getFleetRuntimeSummary
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      responses:
        '200':
          description: Runtime Fleet state visible to one Namespace member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/agent-runs:
    get:
      tags:
        - Agent Runs
      summary: List governed Agent runs
      operationId: listAgentRuns
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/RuntimeInstanceFilter'
        - $ref: '#/components/parameters/DeploymentPublicIdFilter'
        - $ref: '#/components/parameters/RunStatusFilter'
        - $ref: '#/components/parameters/StartedAfter'
        - $ref: '#/components/parameters/StartedBefore'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of AgentRun summaries visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/agent-runs/{run_public_id}:
    get:
      tags:
        - Agent Runs
      summary: Get one governed Agent run
      operationId: getAgentRun
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunPublicId'
      responses:
        '200':
          description: AgentRun detail with metadata-only telemetry and evidence links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/agent-runs/{run_public_id}/artifacts:
    get:
      tags:
        - Agent Run Artifacts
      summary: List immutable artifact metadata for an Agent run
      operationId: listAgentRunArtifacts
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunPublicId'
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Artifact metadata visible in the requested Namespace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentRunArtifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Agent Run Artifacts
      summary: Register immutable artifact metadata for an Agent run
      description: |
        Registers checksum, size, schema and an internal object key/URI only.
        DuckDock does not download or parse artifact content in this operation.
      operationId: registerAgentRunArtifact
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunPublicId'
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunArtifactCreate'
      responses:
        '201':
          description: Artifact metadata registered or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunArtifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/telemetry-sinks:
    get:
      tags:
        - Telemetry Sinks
      summary: List provider-neutral telemetry sinks
      operationId: listTelemetrySinks
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: include_disabled
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Telemetry sinks visible in the requested Namespace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetrySink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Telemetry Sinks
      summary: Create a provider-neutral telemetry sink
      operationId: createTelemetrySink
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySinkCreate'
      responses:
        '201':
          description: Telemetry sink created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/telemetry-sinks/{public_id}:
    get:
      tags:
        - Telemetry Sinks
      summary: Get one telemetry sink
      operationId: getTelemetrySink
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TelemetrySinkPublicId'
      responses:
        '200':
          description: Telemetry sink detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Telemetry Sinks
      summary: Update mutable telemetry sink configuration
      operationId: updateTelemetrySink
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TelemetrySinkPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySinkUpdate'
      responses:
        '200':
          description: Telemetry sink updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/telemetry-sinks/{public_id}/disable:
    post:
      tags:
        - Telemetry Sinks
      summary: Disable a telemetry sink
      operationId: disableTelemetrySink
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TelemetrySinkPublicId'
      responses:
        '200':
          description: Telemetry sink disabled or already disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/outbox/health:
    get:
      tags:
        - Outbox Operations
      summary: Get transactional Outbox backlog health
      operationId: getOutboxHealth
      description: Requires a system administrator JWT.
      security:
        - UserBearerAuth: []
      responses:
        '200':
          description: Pending age and status counts without event payload content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/outbox/{event_id}/retry:
    post:
      tags:
        - Outbox Operations
      summary: Retry one exhausted Outbox event
      operationId: retryOutboxEvent
      description: Requires a system administrator JWT and accepts FAILED events only.
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxRetryRequest'
      responses:
        '200':
          description: Event reset to PENDING without changing its immutable event ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reconciliation/health:
    get:
      tags:
        - Compatibility Reconciliation
      summary: Get v1 to v2 reconciliation health
      operationId: getV1V2ReconciliationHealth
      description: |
        Requires a system administrator JWT. EXPECTED_LEGACY_ONLY is an
        explained compatibility state, while MISMATCH is an unexplained
        difference that must be investigated.
      security:
        - UserBearerAuth: []
      responses:
        '200':
          description: Aggregate reconciliation counts without report or event content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/reconciliation/work-traces/{work_trace_id}:
    get:
      tags:
        - Compatibility Reconciliation
      summary: Get one WorkTrace reconciliation
      operationId: getV1V2WorkTraceReconciliation
      description: Requires a system administrator JWT.
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkTraceId'
      responses:
        '200':
          description: Safe reconciliation status and typed-link counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1V2Reconciliation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Compatibility Reconciliation
      summary: Recompute one WorkTrace reconciliation
      operationId: reconcileV1V2WorkTrace
      description: |
        Requires a system administrator JWT. Recomputes only from the stored,
        allowlisted compatibility event and typed AgentRun links.
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkTraceId'
      responses:
        '200':
          description: Recomputed safe reconciliation status and typed-link counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1V2Reconciliation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    ReporterBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DuckDock Reporter Token
      description: |
        Scoped, rotatable Reporter credential bound to a Namespace and Runtime.
        The execution API requires the `execution.write` scope. The credential
        cannot be used as a user JWT or to read arbitrary AgentRuns.
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated key retained with a canonical request hash. The same
        key and body replay the original response; a different body returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    SessionPublicId:
      name: session_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RunPublicId:
      name: run_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    TelemetrySinkPublicId:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^tsk_[0-9a-f]{32}$'
    TelemetrySinkProjectionPublicId:
      name: sink_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^tsk_[0-9a-f]{32}$'
    AdapterHandshakeHeader:
      name: DuckDock-Handshake-Id
      in: header
      required: false
      description: Optional G2 binding to an active Generic OTLP adapter handshake.
      schema:
        type: string
        pattern: '^hs_[0-9a-f]{32}$'
    PackImportPublicId:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^pki_[0-9a-f]{32}$'
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkTraceId:
      name: work_trace_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    NamespaceId:
      name: namespace_id
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    RuntimeInstanceFilter:
      name: runtime_instance_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    DeploymentPublicIdFilter:
      name: deployment_public_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    RunStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/RunStatus'
    StartedAfter:
      name: started_after
      in: query
      required: true
      description: Inclusive UTC lower bound for a query window of at most 31 days.
      schema:
        type: string
        format: date-time
    StartedBefore:
      name: started_before
      in: query
      required: true
      description: Exclusive UTC upper bound for a query window of at most 31 days.
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2000

  responses:
    Unauthorized:
      description: Missing, invalid, expired, or incorrectly scoped bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated credential lacks the required execution scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible in the caller scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Invalid lifecycle transition or Idempotency-Key payload conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The execution envelope exceeds the 64 KiB request limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request violates the v2 lifecycle, correlation, or metadata-only contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IngestionDisabled:
      description: New execution starts are disabled during rollout or backout.
      headers:
        Retry-After:
          description: Minimum number of seconds before retrying a start request.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    AgentPackageV2:
      $ref: ./agent-package-v2.schema.json
    TelemetryEnvelopeV1:
      $ref: ./telemetry-envelope-v1.schema.json
    EvaluationResultV1:
      $ref: ./evaluation-result-v1.schema.json
    ReleaseManifestV1:
      $ref: ./release-manifest-v1.schema.json

    OtlpTraceExportRequest:
      type: object
      description: |
        Standard OTLP JSON ExportTraceServiceRequest after Collector
        authentication, governance replacement and metadata-only filtering.
        DuckDock validates correlation metadata but never stores this document.
      required:
        - resourceSpans
      properties:
        resourceSpans:
          type: array
          items:
            type: object
      additionalProperties: true

    OtlpTraceExportResponse:
      type: object
      additionalProperties: false
      properties:
        partialSuccess:
          type: object
          additionalProperties: false
          required:
            - rejectedSpans
            - errorMessage
          properties:
            rejectedSpans:
              type: string
              pattern: '^[0-9]+$'
            errorMessage:
              type: string
              maxLength: 100

    PackProducer:
      type: object
      additionalProperties: false
      required:
        - adapter_id
        - adapter_version
        - instance_id
      properties:
        adapter_id:
          type: string
          minLength: 1
          maxLength: 100
        adapter_version:
          type: string
          minLength: 1
          maxLength: 50
        profile:
          type: string
          const: pack-atif-import
          default: pack-atif-import
        protocol:
          type: string
          const: duckdock-adapter
          default: duckdock-adapter
        protocol_version:
          type: string
          const: '1.0'
          default: '1.0'
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        handshake_id:
          type:
            - string
            - 'null'
          pattern: '^hs_[0-9a-f]{32}$'

    AdapterProfile:
      type: string
      enum:
        - openclaw-reporter
        - hermes-reporter
        - generic-otlp-bridge
        - pack-atif-import

    AdapterConfigDrift:
      type: string
      enum:
        - NONE
        - CONFIG_CHANGED
        - BOOT_CHANGED
        - CAPABILITY_CHANGED

    AdapterDescriptor:
      type: object
      additionalProperties: false
      required:
        - adapter_id
        - adapter_version
        - profile
        - source_schema
        - source_schema_version
        - capabilities
        - content_capture_modes
        - instance_id
        - boot_id
        - client_nonce
        - client_time
      properties:
        adapter_id:
          type: string
          minLength: 1
          maxLength: 100
        adapter_version:
          type: string
          minLength: 1
          maxLength: 50
        profile:
          $ref: '#/components/schemas/AdapterProfile'
        protocol:
          type: string
          const: duckdock-adapter
          default: duckdock-adapter
        protocol_version:
          type: string
          const: '1.0'
          default: '1.0'
        source_schema:
          type: string
          minLength: 1
          maxLength: 100
        source_schema_version:
          type: string
          minLength: 1
          maxLength: 50
        capabilities:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9._-]*$'
        content_capture_modes:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/MetadataOnlyCaptureMode'
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        boot_id:
          type: string
          minLength: 1
          maxLength: 128
        client_nonce:
          type: string
          minLength: 22
          maxLength: 171
          pattern: '^[A-Za-z0-9_-]+$'
        client_time:
          type: string
          format: date-time
        claimed_capability_level:
          type: string
          enum:
            - DD-C0
            - DD-C1
            - DD-C2
            - DD-C3
          default: DD-C0
        config_fingerprint:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-f]{64}$'

    AdapterHandshake:
      type: object
      additionalProperties: false
      required:
        - handshake_id
        - protocol_version
        - runtime_public_id
        - profile
        - accepted_capabilities
        - rejected_capabilities
        - claimed_capability_level
        - certified_capability_level
        - content_capture_mode
        - clock_skew_degraded
        - limits
        - idempotency
        - server_time
        - expires_at
      properties:
        handshake_id:
          type: string
          pattern: '^hs_[0-9a-f]{32}$'
        protocol_version:
          type: string
          const: '1.0'
        runtime_public_id:
          type: string
          pattern: '^rt_[0-9a-f]{32}$'
        profile:
          $ref: '#/components/schemas/AdapterProfile'
        accepted_capabilities:
          type: array
          maxItems: 16
          items:
            type: string
        rejected_capabilities:
          type: array
          maxItems: 16
          items:
            type: string
        claimed_capability_level:
          type: string
        certified_capability_level:
          type: string
        content_capture_mode:
          $ref: '#/components/schemas/MetadataOnlyCaptureMode'
        clock_skew_degraded:
          type: boolean
        limits:
          type: object
          additionalProperties:
            type: integer
        idempotency:
          type: object
          additionalProperties:
            oneOf:
              - type: integer
              - type: string
        server_time:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    AdapterHeartbeat:
      type: object
      additionalProperties: false
      required:
        - handshake_id
        - boot_id
        - accepted_capabilities
      properties:
        handshake_id:
          type: string
          pattern: '^hs_[0-9a-f]{32}$'
        boot_id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum: [ok, degraded, error]
          default: ok
        accepted_capabilities:
          type: array
          minItems: 0
          maxItems: 16
          uniqueItems: true
          items:
            type: string
        config_fingerprint:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-f]{64}$'
        collector_status:
          type:
            - string
            - 'null'
          enum:
            - healthy
            - degraded
            - unavailable
            - not_applicable
            - null
        collector_version:
          type:
            - string
            - 'null'
          maxLength: 64

    AdapterHeartbeatAck:
      type: object
      additionalProperties: false
      required:
        - handshake_id
        - status
        - config_drift
        - rehandshake_required
        - last_heartbeat_at
        - expires_at
      properties:
        handshake_id:
          type: string
          pattern: '^hs_[0-9a-f]{32}$'
        status:
          type: string
          enum: [ACTIVE, DEGRADED, EXPIRED]
        config_drift:
          $ref: '#/components/schemas/AdapterConfigDrift'
        rehandshake_required:
          type: boolean
        last_heartbeat_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    FleetHeartbeat:
      type: object
      additionalProperties: false
      required:
        - status
        - config_drift
        - collector_status
        - collector_version
        - observed_at
      properties:
        status:
          type: string
        config_drift:
          $ref: '#/components/schemas/AdapterConfigDrift'
        collector_status:
          type:
            - string
            - 'null'
        collector_version:
          type:
            - string
            - 'null'
        observed_at:
          type: string
          format: date-time

    FleetRuntime:
      type: object
      additionalProperties: false
      required:
        - runtime_public_id
        - provider
        - name
        - runtime_status
        - accepted_capabilities
        - rejected_capabilities
        - handshake_status
        - heartbeat_state
        - heartbeat_history
        - namespace_telemetry_sink_count
        - namespace_active_telemetry_sink_count
        - pending_pack_import_count
        - quarantined_item_count
      properties:
        runtime_public_id:
          type: string
          pattern: '^rt_[0-9a-f]{32}$'
        provider:
          type: string
        name:
          type: string
        runtime_status:
          type: string
          enum: [active, degraded, disabled]
        profile:
          oneOf:
            - $ref: '#/components/schemas/AdapterProfile'
            - type: 'null'
        adapter_id:
          type: [string, 'null']
        adapter_version:
          type: [string, 'null']
        certified_capability_level:
          type: [string, 'null']
        accepted_capabilities:
          type: array
          maxItems: 16
          items:
            type: string
        rejected_capabilities:
          type: array
          maxItems: 16
          items:
            type: string
        handshake_status:
          type: string
          enum: [ACTIVE, DEGRADED, EXPIRED, SUPERSEDED, NONE]
        heartbeat_state:
          type: string
          enum: [HEALTHY, STALE, NEVER, ERROR]
        last_heartbeat_at:
          type: [string, 'null']
          format: date-time
        handshake_expires_at:
          type: [string, 'null']
          format: date-time
        config_drift:
          oneOf:
            - $ref: '#/components/schemas/AdapterConfigDrift'
            - type: 'null'
        collector_status:
          type: [string, 'null']
        collector_version:
          type: [string, 'null']
        heartbeat_history:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FleetHeartbeat'
        namespace_telemetry_sink_count:
          type: integer
          minimum: 0
        namespace_active_telemetry_sink_count:
          type: integer
          minimum: 0
        latest_run_at:
          type: [string, 'null']
          format: date-time
        pending_pack_import_count:
          type: integer
          minimum: 0
        quarantined_item_count:
          type: integer
          minimum: 0

    FleetSummary:
      type: object
      additionalProperties: false
      required:
        - namespace_id
        - runtime_count
        - healthy_count
        - stale_count
        - degraded_count
        - drifted_count
        - runtimes
      properties:
        namespace_id:
          type: integer
          minimum: 1
        runtime_count:
          type: integer
          minimum: 0
        healthy_count:
          type: integer
          minimum: 0
        stale_count:
          type: integer
          minimum: 0
        degraded_count:
          type: integer
          minimum: 0
        drifted_count:
          type: integer
          minimum: 0
        runtimes:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FleetRuntime'

    PackDeploymentReference:
      type: object
      additionalProperties: false
      required:
        - external_deployment_id
        - revision
      properties:
        external_deployment_id:
          type: string
          minLength: 1
          maxLength: 255
        revision:
          type: string
          minLength: 1
          maxLength: 128

    PackPayloadManifest:
      type: object
      additionalProperties: false
      required:
        - path
        - media_type
        - size_bytes
        - sha256
        - schema_version
        - completeness
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: Normalized relative POSIX path; traversal and manifest.json are forbidden.
        media_type:
          type: string
          enum:
            - application/json
            - application/atif+json
            - application/vnd.atif+json
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        schema_name:
          type: string
          const: ATIF
          default: ATIF
        schema_version:
          type: string
          minLength: 1
          maxLength: 50
        sensitivity:
          type: string
          enum:
            - public
            - internal
            - confidential
            - restricted
          default: restricted
        completeness:
          $ref: '#/components/schemas/AgentRunArtifactCompleteness'
        loss_reason:
          type:
            - string
            - 'null'
          maxLength: 100
        content_capture_mode:
          $ref: '#/components/schemas/MetadataOnlyCaptureMode'
        content_policy_version:
          type:
            - string
            - 'null'
          maxLength: 64
        redaction_policy_version:
          type:
            - string
            - 'null'
          maxLength: 64
        redaction_receipt_sha256:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-f]{64}$'

    PackManifest:
      type: object
      additionalProperties: false
      required:
        - pack_id
        - producer
        - created_at
        - payloads
      properties:
        manifest_schema:
          type: string
          const: duckdock-pack
          default: duckdock-pack
        manifest_version:
          type: string
          const: '1.0'
          default: '1.0'
        pack_id:
          type: string
          minLength: 1
          maxLength: 128
        producer:
          $ref: '#/components/schemas/PackProducer'
        created_at:
          type: string
          format: date-time
        run_public_id:
          type:
            - string
            - 'null'
          maxLength: 36
        external_session_id:
          type:
            - string
            - 'null'
          maxLength: 256
        external_run_id:
          type:
            - string
            - 'null'
          maxLength: 256
        deployment:
          oneOf:
            - $ref: '#/components/schemas/PackDeploymentReference'
            - type: 'null'
        otel_trace_id:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-f]{32}$'
        content_capture_mode:
          $ref: '#/components/schemas/MetadataOnlyCaptureMode'
        payloads:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/PackPayloadManifest'

    PackImportCreate:
      type: object
      additionalProperties: false
      required:
        - expected_pack_sha256
        - expected_size_bytes
        - manifest
      properties:
        expected_pack_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        expected_size_bytes:
          type: integer
          minimum: 1
          maximum: 67108864
        upload_mode:
          $ref: '#/components/schemas/PackUploadMode'
        multipart_part_size_bytes:
          type:
            - integer
            - 'null'
          minimum: 5242880
          maximum: 67108864
        manifest:
          $ref: '#/components/schemas/PackManifest'

    PackUploadMode:
      type: string
      enum:
        - SINGLE_PUT
        - MULTIPART

    PackImportFinalize:
      type: object
      additionalProperties: false
