apiVersion: v1
kind: ServiceAccount
metadata:
  name: duckdock
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: duckdock-migrate
  labels:
    app.kubernetes.io/name: duckdock
    app.kubernetes.io/part-of: duckdock
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duckdock
        app.kubernetes.io/part-of: duckdock
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: duckdock
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: duckdock/backend
          command: [python, -m, alembic, -c, alembic.ini, upgrade, head]
          envFrom:
            - secretRef:
                name: duckdock-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: duckdock
    app.kubernetes.io/part-of: duckdock
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  minReadySeconds: 15
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/part-of: duckdock, app.kubernetes.io/component: backend}
    spec:
      serviceAccountName: duckdock
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: backend}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: backend}
      containers:
        - name: backend
          image: duckdock/backend
          args: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8801", --workers, "2", --timeout-graceful-shutdown, "90"]
          envFrom:
            - secretRef: {name: duckdock-runtime-secrets}
          ports: [{name: http, containerPort: 8801}]
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: [/bin/sh, -c, sleep 15]}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: repos, mountPath: /repos}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: repos
          persistentVolumeClaim: {claimName: duckdock-repos-rwx}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: backend}
spec:
  selector: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: backend}
  ports: [{name: http, port: 8801, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: duckdock
    app.kubernetes.io/part-of: duckdock
    app.kubernetes.io/component: frontend
spec:
  replicas: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/part-of: duckdock, app.kubernetes.io/component: frontend}
    spec:
      serviceAccountName: duckdock
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: frontend}
      containers:
        - name: frontend
          image: duckdock/frontend
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: nginx-tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: nginx-cache, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: frontend}
spec:
  selector: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: duckdock
    app.kubernetes.io/part-of: duckdock
    app.kubernetes.io/component: worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/part-of: duckdock, app.kubernetes.io/component: worker}
    spec:
      serviceAccountName: duckdock
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: worker}
      containers:
        - name: worker
          image: duckdock/backend
          command: [celery, -A, app.workers.celery_app, worker, --loglevel=info, --concurrency=4]
          envFrom:
            - secretRef: {name: duckdock-runtime-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: repos, mountPath: /repos}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: repos
          persistentVolumeClaim: {claimName: duckdock-repos-rwx}
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  labels:
    app.kubernetes.io/name: duckdock
    app.kubernetes.io/part-of: duckdock
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/component: beat}
  template:
    metadata:
      labels: {app.kubernetes.io/name: duckdock, app.kubernetes.io/part-of: duckdock, app.kubernetes.io/component: beat}
    spec:
      serviceAccountName: duckdock
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: duckdock/backend
          command: [celery, -A, app.workers.celery_app, beat, --loglevel=info, --schedule=/tmp/celerybeat-schedule]
          envFrom:
            - secretRef: {name: duckdock-runtime-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckdock
  labels:
    app.kubernetes.io/name: duckdock
    app.kubernetes.io/part-of: duckdock
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [duckdock.example.invalid]
      secretName: duckdock-ingress-tls
  rules:
    - host: duckdock.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {name: http}}
