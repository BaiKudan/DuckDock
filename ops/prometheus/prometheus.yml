global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/duckdock-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: duckdock-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8801"]
        labels:
          service: duckdock-control-plane
