global:
  resolve_timeout: 5m

route:
  receiver: duckdock-oncall
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: duckdock-pager
      repeat_interval: 30m

receivers:
  - name: duckdock-oncall
    webhook_configs:
      - url: https://__CHANGE_ME_ONCALL_WEBHOOK__
        send_resolved: true
  - name: duckdock-pager
    webhook_configs:
      - url: https://__CHANGE_ME_PAGER_WEBHOOK__
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]
