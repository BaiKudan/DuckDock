# DuckDock S4 / RT-06 Generic OTLP bridge.
#
# One instance is bound to one registered Runtime. Receiver credentials prove
# only the channel; Runtime/Namespace identity comes from deployment config and
# the DuckDock ReporterCredential used by the projection exporter.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/runtime:
    htpasswd:
      inline: ${env:DUCKDOCK_OTEL_HTPASSWD}
  file_storage/generic:
    directory: /var/lib/otelcol/generic
    timeout: 10s
    max_size: ${env:DUCKDOCK_OTEL_QUEUE_MAX_BYTES}
    fsync: true
    create_directory: true
    directory_permissions: "0700"
    compaction:
      on_start: true
      directory: /var/lib/otelcol/generic-compaction
      cleanup_on_start: true

receivers:
  otlp/generic:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
        auth:
          authenticator: basicauth/runtime
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        auth:
          authenticator: basicauth/runtime

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Preserve only validated correlation IDs before deleting every client
  # duckdock.* claim. Temporary keys do not use the governance prefix and are
  # deleted before export.
  transform/strip_untrusted_governance:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - delete_matching_keys(resource.attributes, "^duckdock\\.")
      - context: span
        statements:
          - delete_key(span.attributes, "duckdock_candidate_external_run_id")
          - delete_key(span.attributes, "duckdock_candidate_run_public_id")
          - set(span.attributes["duckdock_candidate_external_run_id"], span.attributes["duckdock.external_run_id"]) where span.attributes["duckdock.external_run_id"] != nil and IsMatch(span.attributes["duckdock.external_run_id"], "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$")
          - set(span.attributes["duckdock_candidate_run_public_id"], span.attributes["duckdock.run.public_id"]) where span.attributes["duckdock.run.public_id"] != nil and IsMatch(span.attributes["duckdock.run.public_id"], "^run_[0-9a-f]{32}$")
          - delete_matching_keys(span.attributes, "^duckdock\\.")
          - set(span.attributes["duckdock.external_run_id"], span.attributes["duckdock_candidate_external_run_id"]) where span.attributes["duckdock_candidate_external_run_id"] != nil
          - set(span.attributes["duckdock.run.public_id"], span.attributes["duckdock_candidate_run_public_id"]) where span.attributes["duckdock_candidate_run_public_id"] != nil
          - delete_key(span.attributes, "duckdock_candidate_external_run_id")
          - delete_key(span.attributes, "duckdock_candidate_run_public_id")

  # Events, link attributes and free-form names/status messages are content
  # surfaces. Default RT-06 policy is metadata-only for both downstream paths.
  filter/drop_content_surfaces:
    error_mode: propagate
    traces:
      span:
        - "Len(span.links) > 0"
      spanevent:
        - "true"

  transform/metadata_only:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
          - set(resource.schema_url, "")
      - context: scope
        statements:
          - keep_keys(scope.attributes, [])
          - set(scope.name, "duckdock.generic-otlp")
          - set(scope.version, "")
          - set(scope.schema_url, "")
      - context: span
        statements:
          - delete_key(span.attributes, "gen_ai.operation.name") where span.attributes["gen_ai.operation.name"] != nil and not IsMatch(span.attributes["gen_ai.operation.name"], "^(chat|text_completion|embeddings|invoke_agent|execute_tool|invoke_workflow|retrieval|generate_content)$")
          - delete_key(span.attributes, "gen_ai.provider.name") where span.attributes["gen_ai.provider.name"] != nil and not IsMatch(span.attributes["gen_ai.provider.name"], "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$")
          - delete_key(span.attributes, "gen_ai.request.model") where span.attributes["gen_ai.request.model"] != nil and not IsMatch(span.attributes["gen_ai.request.model"], "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$")
          - delete_key(span.attributes, "gen_ai.response.model") where span.attributes["gen_ai.response.model"] != nil and not IsMatch(span.attributes["gen_ai.response.model"], "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$")
          - delete_key(span.attributes, "error.type") where span.attributes["error.type"] != nil and not IsMatch(span.attributes["error.type"], "^[A-Za-z0-9][A-Za-z0-9._:/+$-]{0,127}$")
          - keep_keys(span.attributes, ["duckdock.external_run_id", "duckdock.run.public_id", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "error.type"])
          - set(span.name, "duckdock.generic.agent.operation")
          - set(span.status.message, "")
          - set(span.trace_state, "")

  resource/trusted_identity:
    attributes:
      - key: duckdock.namespace.public_id
        value: ${env:DUCKDOCK_OTEL_NAMESPACE_PUBLIC_ID}
        action: upsert
      - key: duckdock.runtime.public_id
        value: ${env:DUCKDOCK_OTEL_RUNTIME_PUBLIC_ID}
        action: upsert
      - key: duckdock.credential.subject
        from_context: auth.username
        action: upsert
      - key: duckdock.trust.level
        value: CHANNEL_AUTHENTICATED
        action: upsert
      - key: duckdock.trust.source
        value: COLLECTOR
        action: upsert
      - key: duckdock.content_capture_mode
        value: metadata_only
        action: upsert
      - key: duckdock.source.schema
        value: otlp-traces
        action: upsert
      - key: duckdock.source.schema_version
        value: "1.0"
        action: upsert
      - key: duckdock.normalizer.version
        value: duckdock-generic-otlp-v1
        action: upsert

  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # Provider data path. The default bridge policy has already removed content,
  # but the payload remains OTLP spans and is never written to DuckDock MySQL.
  otlp_http/provider:
    endpoint: ${env:DUCKDOCK_GENERIC_PROVIDER_OTLP_ENDPOINT}
    encoding: json
    compression: none
    headers:
      Authorization: Bearer ${env:DUCKDOCK_GENERIC_PROVIDER_TOKEN}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/generic
      num_consumers: 1
      block_on_overflow: true
      sizer: requests
      queue_size: ${env:DUCKDOCK_OTEL_QUEUE_SIZE}

  # DuckDock receives the same sanitized OTLP JSON, but parses it into a
  # metadata-only Run/reference/quarantine projection.
  otlp_http/duckdock:
    traces_endpoint: ${env:DUCKDOCK_API_BASE}/api/v2/reporter/telemetry-sinks/${env:DUCKDOCK_TELEMETRY_SINK_PUBLIC_ID}/v1/traces
    encoding: json
    compression: none
    headers:
      Authorization: Bearer ${env:DUCKDOCK_GENERIC_REPORTER_TOKEN}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/generic
      num_consumers: 1
      block_on_overflow: true
      sizer: requests
      queue_size: ${env:DUCKDOCK_OTEL_QUEUE_SIZE}

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  extensions:
    - health_check
    - basicauth/runtime
    - file_storage/generic
  pipelines:
    traces/generic-otlp:
      receivers:
        - otlp/generic
      processors:
        - memory_limiter
        - transform/strip_untrusted_governance
        - filter/drop_content_surfaces
        - transform/metadata_only
        - resource/trusted_identity
        - batch
      exporters:
        - otlp_http/provider
        - otlp_http/duckdock
